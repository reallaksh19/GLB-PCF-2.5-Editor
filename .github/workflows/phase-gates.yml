name: Phase Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phase0:
    name: Phase 0 architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Gate no large modules
        run: npm run test:no-large-modules

      - name: Gate no PCD shims
        run: npm run test:no-pcd-shims

      - name: Gate no PCD mutation
        run: npm run test:no-pcd-mutation

      - name: Gate no legacy PCD DB runtime
        run: npm run test:no-legacy-pcd-db-runtime

      - name: Gate PCD public API
        run: npm run test:pcd-public-api

      - name: Gate PCD integration smoke
        run: npm run test:pcd

      - name: Gate PCD Component Studio contract
        run: npm run test:pcd-component-studio-contract

      - name: Gate PCD canonical geometry contract
        run: npm run test:pcd-canonical-geometry-contract

      - name: Gate PCD Workbench model contract
        run: npm run test:pcd-workbench-model-contract

      - name: Gate PCD graph validation contract
        run: npm run test:pcd-graph-validation-contract

      - name: Gate BM1 benchmark
        run: npm run test:bm1-benchmark

      - name: Gate BM1 pipe-list normalization
        run: npm run test:bm1-pipe-list

      - name: Gate Phase 0 parity
        run: npm run test:phase0-parity

      - name: Gate geometry view
        run: npm run test:geometry-view

      - name: Upload Phase 0 reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-reports
          path: reports/phase0
          if-no-files-found: ignore
