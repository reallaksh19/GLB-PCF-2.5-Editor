name: Phase Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phase0:
    name: Phase 0 architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Phase 0 gates
        run: npm run test:phase0
