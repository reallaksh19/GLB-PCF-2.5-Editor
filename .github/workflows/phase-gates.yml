name: Phase Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phase0:
    name: Phase 0 architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Phase 0 gates
        run: npm run test:phase0

      - name: Upload Phase 0 reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-reports
          path: reports/phase0
          if-no-files-found: ignore
