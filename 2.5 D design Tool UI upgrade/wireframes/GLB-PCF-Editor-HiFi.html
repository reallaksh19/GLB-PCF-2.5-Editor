  /* Thin scrollbar */

  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

  @keyframes fadein { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
  @keyframes slide-up { from{transform:translateY(100%)} to{transform:translateY(0)} }

function Ico({ name, size=14, color='currentColor', sw=1.75, style={} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      style={{ flexShrink:0, display:'block', ...style }}>
      <path d={PATH[name] || PATH.info}/>
    </svg>
  );
}

/* Filled status dot */
function Dot({ color, size=7, pulse=false }) {
  return <div style={{ width:size, height:size, borderRadius:'50%', background:color, flexShrink:0,
    animation: pulse ? 'pulse-dot 1.5s infinite' : 'none' }}/>;
}

/* ═══════════════════════════════════════════════════
   PROFESSIONAL PIPE CANVAS SVG
   Engineering-grade component symbols
═══════════════════════════════════════════════════ */
function PipeCanvas({ theme: T }) {
  const p = T.pipe;
  const hi = T.pipeHi;
  const text = T.textMuted;
  const acc = T.accent;
  const dim = T.border;

  // Grid lines
  const gridLines = [];
  for (let x = 0; x <= 800; x += 40) gridLines.push(<line key={`v${x}`} x1={x} y1={0} x2={x} y2={480} stroke={T.grid} strokeWidth="0.5"/>);
  for (let y = 0; y <= 480; y += 40) gridLines.push(<line key={`h${y}`} x1={0} y1={y} x2={800} y2={y} stroke={T.grid} strokeWidth="0.5"/>);

  return (
    <svg viewBox="0 0 800 480" style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}>
      {/* Grid */}
      {gridLines}

      {/* ── Origin cross ── */}
      <line x1="60" y1="240" x2="80" y2="240" stroke={T.accent} strokeWidth="0.8" opacity="0.5"/>
      <line x1="70" y1="230" x2="70" y2="250" stroke={T.accent} strokeWidth="0.8" opacity="0.5"/>
      <text x="72" y="255" fontSize="7" fill={T.accent} fontFamily="JetBrains Mono" opacity="0.6">0,0</text>

      {/* ═══════════════════════════════
          MAIN PIPE HORIZONTAL RUN
          Double-line engineering style
      ═══════════════════════════════ */}
      {/* Pipe body — double line with fill */}
      <rect x="80" y="225" width="360" height="30" fill={`${p}18`} stroke={p} strokeWidth="1.5" rx="0"/>
      {/* Pipe centre line (dashed) */}
      <line x1="80" y1="240" x2="440" y2="240" stroke={hi} strokeWidth="0.5" strokeDasharray="8,4" opacity="0.4"/>

      {/* ═══════════════════════════════
          PIPE RISERS (vertical)
      ═══════════════════════════════ */}
      <rect x="185" y="140" width="30" height="100" fill={`${p}18`} stroke={p} strokeWidth="1.5"/>
      <line x1="200" y1="140" x2="200" y2="240" stroke={hi} strokeWidth="0.5" strokeDasharray="8,4" opacity="0.4"/>
      {/* Rise label */}
      <text x="207" y="195" fontSize="7" fill={text} fontFamily="JetBrains Mono" transform="rotate(90,207,195)">Z+1200</text>

      {/* ═══════════════════════════════
          ELBOW at riser top
      ═══════════════════════════════ */}
      <path d="M185 140 Q185 110 215 110" fill="none" stroke={p} strokeWidth="7" strokeLinecap="round"/>
      <path d="M185 140 Q185 110 215 110" fill="none" stroke={T.bg0} strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M185 140 Q185 110 215 110" fill="none" stroke={p} strokeWidth="1.5" strokeLinecap="round"/>
      {/* Elbow label */}
      <text x="155" y="118" fontSize="8" fill={hi} fontFamily="DM Sans" fontWeight="600">ELBOW</text>
      <text x="155" y="128" fontSize="7" fill={text} fontFamily="JetBrains Mono">90° LR</text>

      {/* Horizontal run from elbow */}
      <rect x="215" y="96" width="120" height="28" fill={`${p}18`} stroke={p} strokeWidth="1.5"/>
      <line x1="215" y1="110" x2="335" y2="110" stroke={hi} strokeWidth="0.5" strokeDasharray="8,4" opacity="0.4"/>

      {/* ═══════════════════════════════
          GATE VALVE — professional symbol
          Bowtie / gate valve standard
      ═══════════════════════════════ */}
      <g transform="translate(270,225)">
        {/* Valve body — bowtie shape */}
        <polygon points="-18,0 0,-14 18,0 0,14" fill={`${T.yellow}22`} stroke={T.yellow} strokeWidth="1.5"/>
        <polygon points="-18,0 0,-14 18,0 0,14" fill="none" stroke={T.yellow} strokeWidth="1.5"/>
        {/* Gate line across */}
        <line x1="-18" y1="0" x2="18" y2="0" stroke={T.yellow} strokeWidth="1"/>
        {/* Actuator stem */}
        <line x1="0" y1="-14" x2="0" y2="-26" stroke={T.yellow} strokeWidth="1.5"/>
        <rect x="-6" y="-32" width="12" height="7" rx="1" fill={`${T.yellow}33`} stroke={T.yellow} strokeWidth="1"/>
        {/* Valve label */}
        <text x="22" y="-18" fontSize="8" fill={T.yellow} fontFamily="DM Sans" fontWeight="600">GATE VALVE</text>
        <text x="22" y="-8" fontSize="7" fill={text} fontFamily="JetBrains Mono">PN16 · 168.3 OD</text>
        {/* Flanges at valve ends */}
        <line x1="-18" y1="-8" x2="-18" y2="8" stroke={T.purple} strokeWidth="2"/>
        <line x1="-21" y1="-8" x2="-21" y2="8" stroke={T.purple} strokeWidth="2"/>
        <line x1="18" y1="-8" x2="18" y2="8" stroke={T.purple} strokeWidth="2"/>
        <line x1="21" y1="-8" x2="21" y2="8" stroke={T.purple} strokeWidth="2"/>
      </g>

      {/* ═══════════════════════════════
          TEE FITTING
      ═══════════════════════════════ */}
      <g transform="translate(370,225)">
        {/* Tee symbol — cross with reinforced joint */}
        <rect x="-15" y="-15" width="30" height="30" fill={`${T.green}15`} stroke={T.green} strokeWidth="1.5" rx="2"/>
        {/* Branch pipe going down */}
        <rect x="-15" y="15" width="30" height="70" fill={`${p}18`} stroke={p} strokeWidth="1.5"/>
        <line x1="0" y1="15" x2="0" y2="85" stroke={hi} strokeWidth="0.5" strokeDasharray="6,4" opacity="0.4"/>
        {/* Tee label */}
        <text x="22" y="-6" fontSize="8" fill={T.green} fontFamily="DM Sans" fontWeight="600">TEE</text>
        <text x="22" y="4" fontSize="7" fill={text} fontFamily="JetBrains Mono">168.3 × 88.9</text>
        {/* Branch label */}
        <text x="7" y="55" fontSize="7" fill={text} fontFamily="JetBrains Mono" transform="rotate(90,7,55)">BRANCH</text>
      </g>

      {/* ═══════════════════════════════
          FLANGE (weld neck style)
      ═══════════════════════════════ */}
      <g transform="translate(140,225)">
        {/* WN Flange — two parallel lines with bolt circle hint */}
        <rect x="-3" y="-18" width="6" height="36" fill={`${T.purple}30`} stroke={T.purple} strokeWidth="2"/>
        <rect x="-10" y="-22" width="10" height="44" fill={`${T.purple}15`} stroke={T.purple} strokeWidth="1.5" rx="1"/>

        {[-14,-7,0,7,14].map(y => (
          <circle key={y} cx="-14" cy={y} r="1.5" fill="none" stroke={T.purple} strokeWidth="1"/>
        ))}
        {/* Label */}
        <text x="-38" y="-28" fontSize="8" fill={T.purple} fontFamily="DM Sans" fontWeight="600">WN FLANGE</text>
        <text x="-38" y="-18" fontSize="7" fill={text} fontFamily="JetBrains Mono">PN16 · B16.5</text>
      </g>

      {/* ═══════════════════════════════
          REDUCER
      ═══════════════════════════════ */}
      <g transform="translate(480,225)">
        {/* Concentric reducer trapezoid */}
        <polygon points="-20,-15 20,-10 20,10 -20,15" fill={`${p}18`} stroke={p} strokeWidth="1.5"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke={hi} strokeWidth="0.5" strokeDasharray="6,4" opacity="0.35"/>
        {/* Label */}
        <text x="26" y="-6" fontSize="8" fill={hi} fontFamily="DM Sans" fontWeight="600">REDUCER</text>
        <text x="26" y="4" fontSize="7" fill={text} fontFamily="JetBrains Mono">168.3 → 114.3</text>
        {/* Continuation pipe */}
        <rect x="20" y="-10" width="60" height="20" fill={`${p}18`} stroke={p} strokeWidth="1.5"/>
      </g>

      {/* ═══════════════════════════════
          PIPE SUPPORT
      ═══════════════════════════════ */}
      <g transform="translate(160,225)">
        {/* U-bolt support symbol */}
        <path d="M-10,15 L-10,0 Q-10,-12 0,-12 Q10,-12 10,0 L10,15" fill="none" stroke={T.green} strokeWidth="1.5"/>
        <line x1="-14" y1="15" x2="14" y2="15" stroke={T.green} strokeWidth="2.5" strokeLinecap="round"/>
        {/* Hanger rods */}
        <line x1="-14" y1="15" x2="-14" y2="28" stroke={T.green} strokeWidth="1"/>
        <line x1="14" y1="15" x2="14" y2="28" stroke={T.green} strokeWidth="1"/>
        <line x1="-18" y1="28" x2="18" y2="28" stroke={T.green} strokeWidth="1.5"/>
        {/* Label */}
        <text x="16" y="-4" fontSize="8" fill={T.green} fontFamily="DM Sans" fontWeight="600">SUPPORT</text>
        <text x="16" y="6" fontSize="7" fill={text} fontFamily="JetBrains Mono">U-BOLT</text>
      </g>

      {/* ═══════════════════════════════
          PIPE DIMENSIONS / ANNOTATIONS
      ═══════════════════════════════ */}
      {/* Dimension line for main run */}
      <g opacity="0.6">
        <line x1="80" y1="270" x2="440" y2="270" stroke={dim} strokeWidth="0.75"/>
        <line x1="80" y1="265" x2="80" y2="275" stroke={dim} strokeWidth="0.75"/>
        <line x1="440" y1="265" x2="440" y2="275" stroke={dim} strokeWidth="0.75"/>
        <text x="260" y="282" fontSize="8" fill={text} fontFamily="JetBrains Mono" textAnchor="middle">5000 mm</text>
      </g>

      {/* Node points */}
      {[[80,240],[440,240],[200,140],[335,110]].map(([x,y],i) => (
        <g key={i}>
          <circle cx={x} cy={y} r="5" fill={T.bg0} stroke={p} strokeWidth="1.5"/>
          <circle cx={x} cy={y} r="2" fill={p}/>
        </g>
      ))}

      {/* Pipe label */}
      <text x="80" y="220" fontSize="8" fill={hi} fontFamily="JetBrains Mono" fontWeight="600">L01-P-001 / OD=168.3 / CS / PN16</text>

      {/* Selected highlight ring on valve */}
      <circle cx="270" cy="225" r="30" fill="none" stroke={T.accent} strokeWidth="1" strokeDasharray="3,3" opacity="0.7"/>

      {/* Coordinate labels at nodes */}
      {[
        [80,240,'(0,0,0)'],
        [440,240,'(5000,0,0)'],
        [200,140,'(1500,0,1200)'],
        [335,110,'(3200,0,1200)'],
      ].map(([x,y,label]) => (
        <text key={label} x={x+6} y={y-8} fontSize="6.5" fill={text} fontFamily="JetBrains Mono">{label}</text>
      ))}
    </svg>

/* ═══════════════════════════════════════════════════
   DRAGGABLE HUD CARD
═══════════════════════════════════════════════════ */
function HudCard({ cfg, theme:T, onClose }) {
  const [pos, setPos] = React.useState({ x:80, y:80 });
  const [dragging, setDragging] = React.useState(false);
  const dragRef = React.useRef(null);

  const onMouseDown = e => {
    dragRef.current = { sx: e.clientX - pos.x, sy: e.clientY - pos.y };
    setDragging(true);
  };
  React.useEffect(() => {
    if (!dragging) return;
    const mm = e => setPos({ x: e.clientX - dragRef.current.sx, y: e.clientY - dragRef.current.sy });
    const mu = () => setDragging(false);
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
    return () => { window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
  }, [dragging]);

  if (!cfg) return null;

  const accentColor = cfg.color;
  const s = {
    card: {
      position:'absolute', left:pos.x, top:pos.y, zIndex:200,
      width:230, background:T.bg1,
      border:`1px solid ${accentColor}55`,
      borderRadius:7,
      boxShadow:`0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px ${T.border}`,
      overflow:'hidden',
      animation:'fadein 0.15s ease',
      userSelect: dragging ? 'none' : 'auto',
    },
    header: {
      background:`${accentColor}15`,
      borderBottom:`1px solid ${accentColor}33`,
      padding:'7px 10px',
      display:'flex', alignItems:'center', gap:7,
      cursor:'grab',
    },
    section: { padding:'8px 10px', borderBottom:`1px solid ${T.border}` },
    label: { fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted, letterSpacing:'0.06em', marginBottom:4, display:'block' },
    input: { background:T.bg0, border:`1px solid ${T.border}`, borderRadius:3, padding:'4px 8px', fontFamily:'JetBrains Mono', fontSize:10, color:T.text, width:'100%', outline:'none' },
    seg: (active) => ({ flex:1, height:24, background: active ? `${accentColor}25` : T.bg3, border:`1px solid ${active ? accentColor : T.border}`, borderRadius:3, color: active ? accentColor : T.textSec, fontFamily:'JetBrains Mono', fontSize:10, fontWeight: active ? 700 : 400, cursor:'pointer' }),
    select: { background:T.bg0, border:`1px solid ${T.border}`, borderRadius:3, padding:'3px 6px', fontFamily:'JetBrains Mono', fontSize:10, color:T.text, width:'100%' },
    actionBtn: (primary, danger) => ({
      flex:1, height:26, borderRadius:3, fontFamily:'JetBrains Mono', fontSize:9.5, fontWeight:600, cursor:'pointer',
      background: primary ? accentColor : danger ? T.redDim : T.bg3,
      border: `1px solid ${primary ? accentColor : danger ? T.red : T.border}`,
      color: primary ? T.bg0 : danger ? T.red : T.textSec,
    }),
  };

  return (
    <div style={s.card}>
      {/* Header / drag handle */}
      <div style={s.header} onMouseDown={onMouseDown}>
        <Ico name={cfg.icon} size={13} color={accentColor}/>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:10, fontWeight:700, color:accentColor, letterSpacing:'0.05em', flex:1 }}>{cfg.title}</span>
        <Ico name="grip" size={12} color={T.textMuted} style={{ opacity:0.5 }}/>
        <button onClick={onClose} style={{ background:'transparent', border:'none', color:T.textMuted, cursor:'pointer', padding:0, lineHeight:1, marginLeft:4 }}>
          <Ico name="close" size={12} color={T.textMuted}/>
        </button>
      </div>

      {/* Fields */}
      {cfg.fields.length > 0 && (
        <div style={s.section}>
          {cfg.fields.map(f => (
            <div key={f.id} style={{ marginBottom:6 }}>
              <span style={s.label}>{f.label.toUpperCase()}</span>
              {f.type === 'seg' ? (
                <div style={{ display:'flex', gap:3 }}>
                  {f.opts.map(o => <button key={o} style={s.seg(o === f.val)}>{o}</button>)}
                </div>
              ) : f.type === 'select' ? (
                <select style={s.select}>{f.opts.map(o => <option key={o} selected={o===f.val}>{o}</option>)}</select>
              ) : f.type === 'badge' ? (
                <div style={{ fontFamily:'JetBrains Mono', fontSize:10, color:T.textSec, background:T.bg3, borderRadius:3, padding:'3px 8px', display:'inline-block' }}>{f.val}</div>
              ) : (
                <input style={s.input} defaultValue={f.val}/>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Info chips */}
      {cfg.info.length > 0 && (
        <div style={{ padding:'6px 10px', borderBottom:`1px solid ${T.border}`, display:'flex', flexDirection:'column', gap:2 }}>
          {Array.from({ length: cfg.info.length / 2 }, (_,i) => (
            <div key={i} style={{ display:'flex', gap:6, alignItems:'baseline' }}>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted, width:60, flexShrink:0 }}>{cfg.info[i*2]}</span>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:9, color:T.textSec }}>{cfg.info[i*2+1]}</span>
            </div>
          ))}
        </div>
      )}

      {/* Actions */}
      <div style={{ padding:'7px 8px', display:'flex', gap:4 }}>
        {cfg.actions.map((a,i) => (
          <button key={i} style={s.actionBtn(a.primary, a.danger)}>{a.label}</button>
        ))}
      </div>
    </div>
  );
}

          {TOOL_GROUPS.map((group, gi) => (
            <React.Fragment key={group.id}>
              {gi > 0 && <div style={{ width:36, height:1, background:T.border, margin:'4px 0', flexShrink:0 }}/>}
              {/* Group label */}
              <div style={{ fontFamily:'JetBrains Mono', fontSize:6.5, color:group.color, letterSpacing:'0.1em', marginBottom:2, opacity:0.7 }}>{group.label}</div>
              {/* Tool buttons */}
              {group.tools.map(t => {
                const active = activeTool === t.id;
                return (
                  <button key={t.id}
                    onClick={() => setActiveTool(t.id)}
                    onMouseEnter={() => setTooltip({ id:t.id, text:`${t.label} [${t.key}] — ${t.desc}` })}
                    onMouseLeave={() => setTooltip(null)}
                    style={{
                      width:42, height:40, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2,
                      background: active ? `${group.color}1a` : 'transparent',
                      border: `1px solid ${active ? group.color : 'transparent'}`,
                      borderRadius:4, cursor:'pointer', marginBottom:2, flexShrink:0,
                      transition:'all 0.12s',
                    }}
                    onMouseOver={e => { if(!active) { e.currentTarget.style.background=T.bg3; e.currentTarget.style.borderColor=T.borderHi; } }}
                    onMouseOut={e => { if(!active) { e.currentTarget.style.background='transparent'; e.currentTarget.style.borderColor='transparent'; } }}
                  >
                    <Ico name={t.icon} size={16} color={active ? group.color : T.textSec} sw={active ? 2 : 1.5}/>
                    <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color: active ? group.color : T.textMuted, whiteSpace:'nowrap', letterSpacing:'0.02em' }}>{t.label}</span>
                  </button>
                );
              })}
            </React.Fragment>
          ))}
          {/* Bottom utility tools */}
          <div style={{ marginTop:'auto', width:'100%', display:'flex', flexDirection:'column', alignItems:'center', padding:'6px 0', borderTop:`1px solid ${T.border}` }}>
            {[['snap','Snap','G'],['layers','Layers',''],['lock','Lock','']].map(([icon, label, key]) => (
              <button key={icon} style={{ width:42, height:36, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:'transparent', border:'1px solid transparent', borderRadius:4, cursor:'pointer', marginBottom:1 }}
                onMouseEnter={e=>{e.currentTarget.style.background=T.bg3;}}
                onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
                <Ico name={icon} size={14} color={T.textMuted} sw={1.5}/>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:T.textMuted }}>{label}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Tooltip */}
      {tooltip && !collapsed && (
        <div style={{ position:'fixed', left:58, top:'auto', background:T.bg2, border:`1px solid ${T.borderHi}`, borderRadius:4, padding:'5px 10px', fontFamily:'JetBrains Mono', fontSize:9, color:T.text, whiteSpace:'nowrap', zIndex:300, pointerEvents:'none', boxShadow:`0 4px 16px rgba(0,0,0,0.4)` }}>
          {tooltip.text}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════ */
function App() {
  const [themeKey, setThemeKey] = React.useState('dark');
  const T = THEMES[themeKey];

  const [activeTool, setActiveTool] = React.useState('line');
  const [hudOpen, setHudOpen] = React.useState(true);
  const [inspectorOpen, setInspectorOpen] = React.useState(true);
  const [macroOpen, setMacroOpen] = React.useState(false);
  const [snapOn, setSnapOn] = React.useState(true);

  const activeGroup = TOOL_GROUPS.find(g => g.tools.some(t => t.id === activeTool));
  const activeCfg = HUD_CONFIG[activeTool] || null;

  const handleSetTool = (id) => {
    setActiveTool(id);
    if (HUD_CONFIG[id] !== null) setHudOpen(true);
    else setHudOpen(false);
  };

  /* Keyboard shortcuts */
  React.useEffect(() => {
    const handler = e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      const key = e.key.toUpperCase();
      for (const g of TOOL_GROUPS) for (const t of g.tools) if (t.key === key || t.key === e.key) { handleSetTool(t.id); return; }
      if (e.key === '`') setMacroOpen(v=>!v);
      if (e.key === 'Escape') setHudOpen(false);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const s = {
    app: { width:'100%', height:'100%', display:'flex', flexDirection:'column', background:T.bg0, fontFamily:'DM Sans, sans-serif', color:T.text, overflow:'hidden' },
    titlebar: { height:30, background:T.bg1, borderBottom:`1px solid ${T.border}`, display:'flex', alignItems:'center', gap:10, padding:'0 12px', flexShrink:0 },
    fileBar: { background:T.bg2, borderBottom:`1px solid ${T.border}`, padding:'4px 10px', display:'flex', alignItems:'center', gap:6, flexShrink:0 },
    midRow: { flex:1, display:'flex', overflow:'hidden', position:'relative' },
    canvas: { flex:1, background:T.canvas, position:'relative', overflow:'hidden' },
    statusBar: { height:24, background:T.bg1, borderTop:`1px solid ${T.border}`, display:'flex', alignItems:'center', padding:'0 12px', gap:16, flexShrink:0 },
  };

  const fileBtn = (icon, label, color) => (
    <button style={{ display:'flex', alignItems:'center', gap:5, height:26, padding:'0 10px', background:T.bg3, border:`1px solid ${T.border}`, borderRadius:4, color:color||T.textSec, fontFamily:'DM Sans', fontSize:10, fontWeight:500, cursor:'pointer', transition:'all 0.12s' }}
      onMouseEnter={e=>{e.currentTarget.style.background=T.bg4;e.currentTarget.style.borderColor=T.borderHi;}}
      onMouseLeave={e=>{e.currentTarget.style.background=T.bg3;e.currentTarget.style.borderColor=T.border;}}>
      <Ico name={icon} size={12} color={color||T.textSec}/>{label}
    </button>
  );

  return (
    <div style={s.app}>

      {/* ── TITLE BAR ── */}
      <div style={s.titlebar}>
        {/* Logo */}
        <div style={{ width:20, height:20, background:T.accent, borderRadius:4, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, boxShadow:`0 0 0 2px ${T.accentDim}` }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:8, fontWeight:800, color:T.bg0 }}>PE</span>
        </div>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:11, fontWeight:700, color:T.text, letterSpacing:'0.05em' }}>GLB-PCF EDITOR</span>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>Release 1A</span>

        {/* Tabs */}
        <div style={{ display:'flex', gap:0, marginLeft:16 }}>
          {['2.5D Viewer','Debug'].map((tab,i) => (
            <button key={tab} style={{ fontFamily:'DM Sans', fontSize:10, fontWeight:600, color: i===0 ? T.accent : T.textMuted, background:'transparent', border:'none', borderBottom: `2px solid ${i===0 ? T.accent : 'transparent'}`, padding:'0 14px', height:30, cursor:'pointer' }}>{tab}</button>
          ))}
        </div>

        {/* Right: theme selector */}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>THEME</span>
          <div style={{ display:'flex', gap:2, background:T.bg3, borderRadius:5, padding:'2px', border:`1px solid ${T.border}` }}>
            {Object.entries(THEMES).map(([key, th]) => (
              <button key={key} onClick={() => setThemeKey(key)}
                title={th.name}
                style={{ height:20, padding:'0 8px', borderRadius:3, border:'none', cursor:'pointer', fontFamily:'JetBrains Mono', fontSize:8, fontWeight:600, background: themeKey===key ? T.accent : 'transparent', color: themeKey===key ? T.bg0 : T.textMuted, transition:'all 0.12s' }}>
                {th.name.split(' ')[0]}
              </button>
            ))}
          </div>
          <button style={{ width:24, height:24, background:T.bg3, border:`1px solid ${T.border}`, borderRadius:4, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <Ico name={themeKey==='light' ? 'moon' : 'sun'} size={12} color={T.textSec}/>
          </button>
        </div>
      </div>

      {/* ── FILE BAR ── */}
      <div style={s.fileBar}>
        {fileBtn('pcf','Open PCF/DXF')}
        {fileBtn('glb','Open GLB')}
        <div style={{ width:1, height:18, background:T.border }}/>
        {fileBtn('export','Export ▾')}
        <div style={{ width:1, height:18, background:T.border }}/>
        {/* Heatmap */}
        <span style={{ fontFamily:'DM Sans', fontSize:10, color:T.textMuted }}>Heatmap</span>
        <select style={{ background:T.bg3, border:`1px solid ${T.border}`, borderRadius:3, color:T.textSec, fontFamily:'DM Sans', fontSize:10, padding:'2px 8px', height:26 }}>
          <option>None</option><option>By OD</option><option>By Material</option><option>By Temp</option><option>By Pressure</option>
        </select>
        {/* Labels toggle */}
        <label style={{ display:'flex', alignItems:'center', gap:5, fontFamily:'DM Sans', fontSize:10, color:T.textSec, cursor:'pointer' }}>
          <Ico name="eye" size={11} color={T.textSec}/>Labels
          <input type="checkbox" defaultChecked style={{ accentColor:T.accent }}/>
        </label>
        <div style={{ width:1, height:18, background:T.border }}/>
        {/* Snap */}
        <button onClick={()=>setSnapOn(v=>!v)} style={{ display:'flex', alignItems:'center', gap:5, height:26, padding:'0 10px', background: snapOn ? T.accentDim : T.bg3, border:`1px solid ${snapOn ? T.accentBorder : T.border}`, borderRadius:4, color: snapOn ? T.accent : T.textSec, fontFamily:'DM Sans', fontSize:10, cursor:'pointer' }}>
          <Ico name="snap" size={11} color={snapOn ? T.accent : T.textSec}/>Snap {snapOn ? 'ON':'OFF'}
        </button>
        {/* Macro toggle */}
        <button onClick={() => setMacroOpen(v=>!v)} style={{ display:'flex', alignItems:'center', gap:5, height:26, padding:'0 10px', background: macroOpen ? T.accentDim : T.bg3, border:`1px solid ${macroOpen ? T.accentBorder : T.border}`, borderRadius:4, color: macroOpen ? T.accent : T.textSec, fontFamily:'DM Sans', fontSize:10, cursor:'pointer', marginLeft:'auto' }}>
          <Ico name="term" size={11} color={macroOpen ? T.accent : T.textSec}/> Macro ` 
        </button>
        {/* Active tool indicator */}
        {activeGroup && (
          <div style={{ display:'flex', alignItems:'center', gap:5, height:26, padding:'0 10px', background:T.bg3, border:`1px solid ${T.border}`, borderRadius:4 }}>
            <Dot color={activeGroup.color} size={6}/>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:9, color:activeGroup.color, fontWeight:700 }}>{activeTool.toUpperCase()}</span>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>active</span>
          </div>
        )}
      </div>

      {/* ── MAIN ROW ── */}
      <div style={s.midRow}>

        {/* Left tool palette */}
        <ToolPalette activeTool={activeTool} setActiveTool={handleSetTool} theme={T}/>

        {/* Canvas */}
        <div style={s.canvas}>
          <PipeCanvas theme={T}/>

          {/* Draggable HUD */}
          {hudOpen && activeCfg && (
            <HudCard cfg={activeCfg} theme={T} onClose={() => setHudOpen(false)}/>
          )}

          {/* HUD re-open button */}
          {!hudOpen && activeCfg && (
            <button onClick={() => setHudOpen(true)} style={{ position:'absolute', left:10, top:10, background:T.bg2, border:`1px solid ${T.accent}55`, borderRadius:4, color:T.accent, fontFamily:'JetBrains Mono', fontSize:9, padding:'5px 12px', cursor:'pointer', zIndex:100 }}>
              <Ico name={activeCfg.icon} size={11} color={T.accent} style={{ display:'inline', verticalAlign:'middle', marginRight:4 }}/>HUD
            </button>
          )}

          {/* View cube */}
          <ViewCube theme={T}/>

          {/* Snap / coord indicator — bottom centre */}
          <div style={{ position:'absolute', bottom:10, left:'50%', transform:'translateX(-50%)', background:`${T.bg1}ee`, border:`1px solid ${T.border}`, borderRadius:4, padding:'4px 14px', display:'flex', gap:14, alignItems:'center', pointerEvents:'none', zIndex:50 }}>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted }}>CURSOR <span style={{ color:T.textSec }}>3244, 0, 0</span></span>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted }}>SNAP <span style={{ color: snapOn ? T.green : T.textMuted }}>{snapOn ? '250mm' : 'OFF'}</span></span>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted }}>OD <span style={{ color:T.textSec }}>168.3</span></span>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted }}>PN <span style={{ color:T.textSec }}>16</span></span>
          </div>
        </div>

        {/* Right inspector drawer */}
        <InspectorDrawer open={inspectorOpen} onToggle={() => setInspectorOpen(v=>!v)} theme={T}/>
      </div>

      {/* Macro tray */}
      <MacroTray open={macroOpen} theme={T}/>

      {/* ── STATUS BAR ── */}
      <div style={s.statusBar}>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <Dot color={T.accent} size={6} pulse={true}/>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textSec }}>
            {activeTool.toUpperCase()} — {HUD_CONFIG[activeTool]?.info?.[1] || 'click to set anchor'} · Enter commit · Esc cancel
          </span>
        </div>
        <div style={{ width:1, height:14, background:T.border }}/>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted }}>Pipeline: L01-P-001</span>
        <div style={{ marginLeft:'auto', display:'flex', gap:16 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>3 components · 1 route</span>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>GLB-PCF-Editor v1A</span>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
