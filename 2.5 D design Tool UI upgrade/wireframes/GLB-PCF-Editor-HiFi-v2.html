function Ico({ name, size=14, color='currentColor', sw=1.75, style={} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      style={{ flexShrink:0, display:'block', ...style }}>
      <path d={PATH[name] || PATH.info}/>
    </svg>
  );
}

function Dot({ color, size=7, pulse=false }) {
  return <div style={{ width:size, height:size, borderRadius:'50%', background:color, flexShrink:0, animation: pulse ? 'pulse-dot 1.5s infinite' : 'none' }}/>;
}

/* ═══════════════════════════════════════════════════
   PROFESSIONAL PIPE CANVAS
   Inspired by snap 4 — double-line pipes, colored component
   symbols, CL dashes, dimension lines, stacked labels
═══════════════════════════════════════════════════ */
function PipeCanvas({ theme: T, showLabels, wireframe }) {
  const p   = T.pipe;
  const phi = T.pipeHi;
  const tm  = T.textMuted;
  const ts  = T.textSec;
  const PW  = 22;   // pipe wall half-width
  const CX  = 70;   // start x
  const CY  = 260;  // centre y (pipe run)
  const END = 680;  // end x

  const grid = [];
  for (let x=0; x<=800; x+=40) grid.push(<line key={`v${x}`} x1={x} y1={0} x2={x} y2={480} stroke={T.grid} strokeWidth="0.5"/>);
  for (let y=0; y<=480; y+=40) grid.push(<line key={`h${y}`} x1={0} y1={y} x2={800} y2={y} stroke={T.grid} strokeWidth="0.5"/>);

  const pipeStyle = wireframe
    ? { fill:'none', stroke:p, strokeWidth:'1.5' }
    : { fill:`${p}1a`, stroke:p, strokeWidth:'1.5' };

  // Elbow coords
  const EX = 290, EY = CY; // elbow on main run
  const RISE_TOP = 130;

  return (
    <svg viewBox="0 0 800 480" style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}>
      {grid}

      {/* ── CL axis (chain-dash, full width) ── */}
      <line x1={CX} y1={CY} x2={END} y2={CY}
        stroke={phi} strokeWidth="0.6" strokeDasharray="14,4,2,4" opacity="0.35"/>
      {/* CL symbol at left */}
      <text x={CX-14} y={CY+1} fontSize="8" fill={phi} fontFamily="JetBrains Mono"
        textAnchor="middle" opacity="0.5">CL</text>
      <line x1={CX-4} y1={CY-5} x2={CX-4} y2={CY+5} stroke={phi} strokeWidth="0.8" opacity="0.4"/>

      {/* ── MAIN PIPE horizontal run — double line ── */}
      {/* Top wall */}
      <line x1={CX} y1={CY-PW} x2={END} y2={CY-PW} stroke={p} strokeWidth="1.8"/>
      {/* Bottom wall */}
      <line x1={CX} y1={CY+PW} x2={END} y2={CY+PW} stroke={p} strokeWidth="1.8"/>
      {/* Cap left */}
      <line x1={CX} y1={CY-PW} x2={CX} y2={CY+PW} stroke={p} strokeWidth="1.8"/>
      {/* Cap right */}
      <line x1={END} y1={CY-PW} x2={END} y2={CY+PW} stroke={p} strokeWidth="1.8"/>
      {/* Fill between walls */}
      {!wireframe && <rect x={CX} y={CY-PW} width={END-CX} height={PW*2} fill={`${p}12`}/>}

      {/* ── WN FLANGE left end ── */}
      <g transform={`translate(${CX+20},${CY})`}>
        {/* Neck */}
        <rect x={-8} y={-PW} width={8} height={PW*2} {...pipeStyle} fill={wireframe?'none':`${T.purple}22`} stroke={T.purple} strokeWidth="1.8"/>
        {/* Plate */}
        <rect x={-18} y={-PW-5} width={10} height={(PW+5)*2} fill={wireframe?'none':`${T.purple}18`} stroke={T.purple} strokeWidth="1.8"/>
        {/* Bolt holes */}
        {[-PW-2, -PW/2, 0, PW/2, PW+2].map(y => (
          <circle key={y} cx={-22} cy={y} r="2" fill="none" stroke={T.purple} strokeWidth="0.8"/>
        ))}
        {showLabels && <>
          <line x1={-22} y1={-PW-18} x2={-22} y2={-PW-10} stroke={T.purple} strokeWidth="0.8" opacity="0.6"/>
          <text x={-22} y={-PW-20} fontSize="7.5" fill={T.purple} fontFamily="DM Sans" fontWeight="700" textAnchor="middle">WN FLANGE</text>
          <text x={-22} y={-PW-10} fontSize="6.5" fill={tm} fontFamily="JetBrains Mono" textAnchor="middle">PN16 · B16.5</text>
          <text x={-22} y={-PW-2} fontSize="6.5" fill={tm} fontFamily="JetBrains Mono" textAnchor="middle">(Ø168.3)</text>
        </>}
      </g>

      {/* ── PIPE SUPPORT ── */}
      <g transform={`translate(${CX+110},${CY})`}>
        <path d={`M-12,${PW} L-12,0 Q-12,-14 0,-14 Q12,-14 12,0 L12,${PW}`}
          fill="none" stroke={T.green} strokeWidth="1.6"/>
        <line x1={-16} y1={PW} x2={16} y2={PW} stroke={T.green} strokeWidth="2.5" strokeLinecap="round"/>
        <line x1={-16} y1={PW} x2={-16} y2={PW+14} stroke={T.green} strokeWidth="1.2"/>
        <line x1={16} y1={PW} x2={16} y2={PW+14} stroke={T.green} strokeWidth="1.2"/>
        <line x1={-20} y1={PW+14} x2={20} y2={PW+14} stroke={T.green} strokeWidth="1.8" strokeLinecap="round"/>
        {showLabels && <>
          <text x={0} y={PW+28} fontSize="7.5" fill={T.green} fontFamily="DM Sans" fontWeight="700" textAnchor="middle">SUPPORT</text>
          <text x={0} y={PW+37} fontSize="6.5" fill={tm} fontFamily="JetBrains Mono" textAnchor="middle">PIPE SUPPORT</text>
          <text x={0} y={PW+45} fontSize="6.5" fill={tm} fontFamily="JetBrains Mono" textAnchor="middle">PS-001</text>
        </>}
      </g>

      {/* ── GATE VALVE — bowtie + flanges + stem ── */}
      <g transform={`translate(${CX+200},${CY})`}>
        {/* Flanges either side */}
        {[-1,1].map(side => (
          <g key={side}>
            <line x1={side*22} y1={-PW-2} x2={side*22} y2={PW+2} stroke={T.purple} strokeWidth="2"/>
            <line x1={side*25} y1={-PW-2} x2={side*25} y2={PW+2} stroke={T.purple} strokeWidth="2"/>
          </g>
        ))}
        {/* Valve body — bowtie */}
        <polygon points={`-22,0 0,${-PW+2} 22,0 0,${PW-2}`}
          fill={wireframe?'none':`${T.yellow}25`} stroke={T.yellow} strokeWidth="1.8"/>
        {/* Centre horizontal */}
        <line x1={-22} y1={0} x2={22} y2={0} stroke={T.yellow} strokeWidth="1"/>
        {/* Stem */}
        <line x1={0} y1={-PW+2} x2={0} y2={-PW-18} stroke={T.yellow} strokeWidth="1.5"/>
        <rect x={-7} y={-PW-26} width={14} height={8} rx="1.5"
          fill={wireframe?'none':`${T.yellow}30`} stroke={T.yellow} strokeWidth="1.2"/>
        <line x1={0} y1={-PW-26} x2={0} y2={-PW-34} stroke={T.yellow} strokeWidth="1.2"/>
        <line x1={-5} y1={-PW-34} x2={5} y2={-PW-34} stroke={T.yellow} strokeWidth="1.8" strokeLinecap="round"/>
        {showLabels && <>
          <text x={30} y={-PW-14} fontSize="7.5" fill={T.yellow} fontFamily="DM Sans" fontWeight="700">GATE VALVE</text>
          <text x={30} y={-PW-5} fontSize="6.5" fill={tm} fontFamily="JetBrains Mono">PN16</text>
          <text x={30} y={-PW+4} fontSize="6.5" fill={tm} fontFamily="JetBrains Mono">(Ø168.3)</text>
        </>}
        {/* Selected dashed ring */}
        <circle cx={0} cy={0} r={PW+12} fill="none" stroke={T.accent} strokeWidth="0.8" strokeDasharray="3,3" opacity="0.7"/>
      </g>

      {/* ── ELBOW — rise ── */}
      <g transform={`translate(${EX},${CY})`}>
        {/* Outer elbow arc top */}
        <path d={`M 0 ${-PW} Q 0 ${-PW-30} ${PW} ${-PW-30}`}
          fill="none" stroke={p} strokeWidth="1.8"/>
        {/* Inner elbow arc top */}
        <path d={`M 0 ${PW} Q 0 ${PW-10} ${PW} ${PW-10}`}
          fill="none" stroke={p} strokeWidth="1.8"/>
        {!wireframe && (
          <path d={`M 0 ${-PW} Q 0 ${-PW-30} ${PW} ${-PW-30} L ${PW} ${PW-10} Q 0 ${PW-10} 0 ${PW} Z`}
            fill={`${p}12`}/>
        )}
        {/* Rise vertical pipe */}
        <line x1={PW} y1={-PW-30} x2={PW} y2={-PW-30-(RISE_TOP)} stroke={p} strokeWidth="1.8"/>
        <line x1={-PW+2*PW+PW} y1={-PW-30} x2={PW+PW} y2={-PW-30-(RISE_TOP)} stroke={p} strokeWidth="1.8"/>
        {!wireframe && <rect x={PW} y={-PW-30-(RISE_TOP)} width={PW} height={RISE_TOP}
          fill={`${p}12`}/>}
        {/* CL for riser */}
        <line x1={PW+PW/2} y1={-PW-30} x2={PW+PW/2} y2={-PW-30-RISE_TOP-10}
          stroke={phi} strokeWidth="0.6" strokeDasharray="10,4,2,4" opacity="0.3"/>
        {/* Cap at top */}
        <line x1={PW} y1={-PW-30-RISE_TOP} x2={PW*3} y2={-PW-30-RISE_TOP} stroke={p} strokeWidth="1.8"/>
        {/* Horizontal run top */}
        <line x1={PW*3} y1={-PW-30-RISE_TOP} x2={PW*3+100} y2={-PW-30-RISE_TOP} stroke={p} strokeWidth="1.8"/>
        <line x1={PW*3} y1={-30-RISE_TOP} x2={PW*3+100} y2={-30-RISE_TOP} stroke={p} strokeWidth="1.8"/>
        {!wireframe && <rect x={PW*3} y={-PW-30-RISE_TOP} width={100} height={PW}
          fill={`${p}12`}/>}
        {/* Dim line for 1200 rise */}
        <line x1={PW*3+110} y1={-PW-30-RISE_TOP} x2={PW*3+110} y2={-PW-30}
          stroke={tm} strokeWidth="0.7" opacity="0.5"/>
        <line x1={PW*3+106} y1={-PW-30-RISE_TOP} x2={PW*3+114} y2={-PW-30-RISE_TOP}
          stroke={tm} strokeWidth="0.7" opacity="0.5"/>
        <line x1={PW*3+106} y1={-PW-30} x2={PW*3+114} y2={-PW-30}
          stroke={tm} strokeWidth="0.7" opacity="0.5"/>
        <text x={PW*3+118} y={(-PW-30-RISE_TOP)/2 + (-PW-30)/2 + 4}
          fontSize="7" fill={tm} fontFamily="JetBrains Mono">1200</text>
        {/* OD label at top */}
        {showLabels && <>
          <text x={PW*3+50} y={-PW-30-RISE_TOP-8} fontSize="7" fill={ts}
            fontFamily="JetBrains Mono" textAnchor="middle">(Ø168.3)</text>
          <text x={PW*2+8} y={-PW-30-RISE_TOP/2} fontSize="7.5" fill={phi}
            fontFamily="DM Sans" fontWeight="700">ELBOW 90° LR</text>
          <text x={PW*2+8} y={-PW-30-RISE_TOP/2+10} fontSize="6.5" fill={tm}
            fontFamily="JetBrains Mono">(Ø168.3)</text>
        </>}
      </g>

      {/* ── TEE FITTING ── */}
      <g transform={`translate(${CX+410},${CY})`}>
        {/* Tee joint box */}
        <rect x={-PW} y={-PW-3} width={PW*2} height={(PW+3)*2}
          fill={wireframe?'none':`${T.green}18`} stroke={T.green} strokeWidth="1.8" rx="2"/>
        {/* Branch pipe down */}
        <line x1={-PW} y1={PW+3} x2={-PW} y2={PW+3+70} stroke={p} strokeWidth="1.8"/>
        <line x1={PW} y1={PW+3} x2={PW} y2={PW+3+70} stroke={p} strokeWidth="1.8"/>
        {!wireframe && <rect x={-PW} y={PW+3} width={PW*2} height={70} fill={`${p}12`}/>}
        {/* CL branch */}
        <line x1={0} y1={PW+3} x2={0} y2={PW+3+80}

  );
}

/* ═══════════════════════════════════════════════════
   COMPACT DRAGGABLE HUD CARD
═══════════════════════════════════════════════════ */
function HudCard({ cfg, theme:T, onClose }) {
  const [pos, setPos] = React.useState({ x:72, y:70 });
  const [dragging, setDragging] = React.useState(false);
  const dragRef = React.useRef(null);

  const onMouseDown = e => {
    dragRef.current = { sx: e.clientX - pos.x, sy: e.clientY - pos.y };
    setDragging(true);
  };
  React.useEffect(() => {
    if (!dragging) return;
    const mm = e => setPos({ x:e.clientX-dragRef.current.sx, y:e.clientY-dragRef.current.sy });
    const mu = () => setDragging(false);
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
    return () => { window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
  }, [dragging]);

  if (!cfg) return null;
  const ac = cfg.color;

  const inputSt = {
    background:T.bg0, border:`1px solid ${T.border}`, borderRadius:3,
    padding:'3px 7px', fontFamily:'JetBrains Mono', fontSize:10,
    color:T.text, width:'100%', outline:'none',
  };
  const segBtn = (active) => ({
    flex:1, height:22, background: active ? `${ac}28` : T.bg3,
    border:`1px solid ${active ? ac : T.border}`, borderRadius:3,
    color: active ? ac : T.textSec, fontFamily:'JetBrains Mono',
    fontSize:10, fontWeight: active?700:400, cursor:'pointer',
  });

  return (
    <div style={{
      position:'absolute', left:pos.x, top:pos.y, zIndex:200,
      width:216, background:T.bg1,
      border:`1px solid ${ac}55`,
      borderRadius:6, boxShadow:`0 6px 28px rgba(0,0,0,0.55)`,
      overflow:'hidden', animation:'fadein 0.15s ease',
      userSelect: dragging?'none':'auto',
    }}>
      {/* ── Header drag bar ── */}
      <div style={{ background:`${ac}14`, borderBottom:`1px solid ${ac}30`, padding:'5px 8px', display:'flex', alignItems:'center', gap:6, cursor:'grab' }} onMouseDown={onMouseDown}>
        <Ico name={cfg.icon} size={12} color={ac}/>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:9.5, fontWeight:700, color:ac, flex:1, letterSpacing:'0.05em' }}>{cfg.title}</span>
        <Ico name="grip" size={11} color={T.textMuted} style={{ opacity:0.4 }}/>
        <button onClick={onClose} style={{ background:'transparent', border:'none', color:T.textMuted, cursor:'pointer', padding:0, lineHeight:1, marginLeft:2, display:'flex' }}>
          <Ico name="close" size={11} color={T.textMuted}/>
        </button>
      </div>

      {/* ── Compact field rows ── */}
      {cfg.rows.length > 0 && (
        <div style={{ padding:'6px 8px', borderBottom:`1px solid ${T.border}`, display:'flex', flexDirection:'column', gap:5 }}>
          {cfg.rows.map((row, ri) => (
            <div key={ri} style={{ display:'flex', gap:4, alignItems:'flex-end' }}>
              {row.fields.map(f => (
                <div key={f.id} style={{ flex:f.flex||1, minWidth:0 }}>
                  <div style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted, letterSpacing:'0.06em', marginBottom:2 }}>
                    {f.label.toUpperCase()}
                  </div>
                  {f.type === 'seg' ? (
                    <div style={{ display:'flex', gap:2 }}>
                      {f.opts.map(o => <button key={o} style={segBtn(o===f.val)}>{o}</button>)}
                    </div>
                  ) : f.type === 'select' ? (
                    <select style={{ ...inputSt, padding:'2px 5px' }}>
                      {f.opts.map(o => <option key={o}>{o}</option>)}
                    </select>
                  ) : f.type === 'badge' ? (
                    <div style={{ fontFamily:'JetBrains Mono', fontSize:10, color:T.textSec, background:T.bg3, borderRadius:3, padding:'3px 7px' }}>{f.val}</div>
                  ) : (
                    <input style={inputSt} defaultValue={f.val}/>
                  )}
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {/* ── Info strip — compact 2-col grid ── */}
      {cfg.info.length > 0 && (
        <div style={{ padding:'4px 8px', borderBottom:`1px solid ${T.border}`, display:'grid', gridTemplateColumns:'auto 1fr', columnGap:8, rowGap:1 }}>
          {Array.from({ length: cfg.info.length/2 }, (_,i) => (
            <React.Fragment key={i}>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted }}>{cfg.info[i*2]}</span>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textSec }}>{cfg.info[i*2+1]}</span>
            </React.Fragment>
          ))}
        </div>
      )}

      {/* ── Actions row ── */}
      <div style={{ padding:'5px 6px', display:'flex', gap:3 }}>
        {cfg.actions.map((a,i) => (
          <button key={i} style={{
            flex:1, height:24, borderRadius:3,
            fontFamily:'JetBrains Mono', fontSize:9, fontWeight:600, cursor:'pointer',
            background: a.primary ? ac : a.danger ? T.redDim : T.bg3,
            border:`1px solid ${a.primary ? ac : a.danger ? T.red : T.border}`,
            color: a.primary ? T.bg0 : a.danger ? T.red : T.textSec,
          }}>{a.label}</button>
        ))}
      </div>
    </div>
  );
}

      </button>
      {!collapsed && (
        <div style={{ flex:1, overflowY:'auto', width:'100%', display:'flex', flexDirection:'column', alignItems:'center', paddingTop:3 }}>
          {LEFT_TOOL_GROUPS.map((g,gi) => (
            <React.Fragment key={g.id}>

              {g.tools.map(t => {
                const active = activeTool===t.id;
                return (
                  <button key={t.id}
                    onClick={()=>setActiveTool(t.id)}
                    onMouseEnter={()=>setTip(`${t.label} [${t.key}] — ${t.desc}`)}

                    style={{ width:40, height:38, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:active?`${g.color}1a`:'transparent', border:`1px solid ${active?g.color:'transparent'}`, borderRadius:4, cursor:'pointer', marginBottom:2, flexShrink:0, transition:'all 0.1s' }}
                    onMouseOver={e=>{ if(!active){e.currentTarget.style.background=T.bg3;e.currentTarget.style.borderColor=T.borderHi;}}}
                    onMouseOut={e=>{ if(!active){e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='transparent';}}}>
                    <Ico name={t.icon} size={15} color={active?g.color:T.textSec} sw={active?2:1.5}/>
                    <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:active?g.color:T.textMuted, whiteSpace:'nowrap' }}>{t.label}</span>
                  </button>

              })}
            </React.Fragment>
          ))}
          <div style={{ marginTop:'auto', width:'100%', display:'flex', flexDirection:'column', alignItems:'center', padding:'4px 0', borderTop:`1px solid ${T.border}` }}>
            {[['layers','Layers'],['lock','Lock']].map(([ic,lb])=>(
              <button key={ic} style={{ width:40, height:34, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:'transparent', border:'1px solid transparent', borderRadius:4, cursor:'pointer' }}

                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <Ico name={ic} size={13} color={T.textMuted} sw={1.5}/>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:T.textMuted }}>{lb}</span>
              </button>
            ))}
          </div>
        </div>
      )}
      {tip && !collapsed && (
        <div style={{ position:'fixed', left:56, top:'auto', background:T.bg2, border:`1px solid ${T.borderHi}`, borderRadius:4, padding:'4px 10px', fontFamily:'JetBrains Mono', fontSize:8.5, color:T.text, whiteSpace:'nowrap', zIndex:400, pointerEvents:'none', boxShadow:'0 4px 16px rgba(0,0,0,0.4)' }}>
          {tip}
        </div>
      )}
    </div>
  );
}

                onClick={()=>setActiveTool(t.id)}
                title={`${t.label} [${t.key}]`}
                style={{ width:40, height:38, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:active?`${color}1a`:'transparent', border:`1px solid ${active?color:'transparent'}`, borderRadius:4, cursor:'pointer', marginBottom:2, flexShrink:0, transition:'all 0.1s' }}
                onMouseOver={e=>{ if(!active){e.currentTarget.style.background=T.bg3;e.currentTarget.style.borderColor=T.borderHi;}}}
                onMouseOut={e=>{ if(!active){e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='transparent';}}}>
                <Ico name={t.icon} size={15} color={active?color:T.textSec} sw={active?2:1.5}/>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:active?color:T.textMuted }}>{t.label}</span>
              </button>
            );
          })}

          <div style={{ width:34, height:1, background:T.border, margin:'4px 0', flexShrink:0 }}/>

          {/* Snap toggle */}
          <button
            onClick={()=>setSnapOn(v=>!v)}
            title="Toggle snap [G]"
            style={{ width:40, height:38, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:snapOn?`${color}1a`:'transparent', border:`1px solid ${snapOn?color:'transparent'}`, borderRadius:4, cursor:'pointer', marginBottom:2, flexShrink:0 }}>
            <Ico name="snap" size={15} color={snapOn?color:T.textSec} sw={snapOn?2:1.5}/>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:snapOn?color:T.textMuted }}>Snap</span>
          </button>

          {/* Layers */}
          <button title="Layers" style={{ width:40, height:38, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:'transparent', border:'1px solid transparent', borderRadius:4, cursor:'pointer', marginBottom:2, flexShrink:0 }}
            onMouseOver={e=>e.currentTarget.style.background=T.bg3}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Ico name="layers" size={15} color={T.textSec} sw={1.5}/>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:T.textMuted }}>Layers</span>
          </button>

          {/* Lock */}
          <button title="Lock selection" style={{ width:40, height:38, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2, background:'transparent', border:'1px solid transparent', borderRadius:4, cursor:'pointer', marginBottom:2, flexShrink:0 }}
            onMouseOver={e=>e.currentTarget.style.background=T.bg3}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Ico name="lock" size={15} color={T.textSec} sw={1.5}/>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:6, color:T.textMuted }}>Lock</span>
          </button>

          {/* Divider before view cube */}
          <div style={{ width:34, height:1, background:T.border, margin:'4px 0', flexShrink:0 }}/>

          {/* Mini view cube */}
          <div style={{ width:40, display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
            <svg width="36" height="30" viewBox="0 0 56 46">
              <polygon points="28,4 50,16 50,34 28,46 6,34 6,16" fill={T.bg3} stroke={T.borderHi} strokeWidth="1.2"/>
              <polygon points="28,4 50,16 28,28 6,16" fill={T.bg4} stroke={T.borderHi} strokeWidth="1.2"/>
              <polygon points="28,28 50,16 50,34 28,46" fill={T.bg2} stroke={T.borderHi} strokeWidth="1.2"/>
              <polygon points="28,28 6,16 6,34 28,46" fill={T.bg3} stroke={T.borderHi} strokeWidth="1.2"/>
              <text x="28" y="21" fontSize="8" fill={T.accent} fontFamily="JetBrains Mono" textAnchor="middle" fontWeight="700">T</text>
              <text x="41" y="34" fontSize="6" fill={T.textMuted} fontFamily="JetBrains Mono" textAnchor="middle">R</text>
              <text x="15" y="34" fontSize="6" fill={T.textMuted} fontFamily="JetBrains Mono" textAnchor="middle">F</text>
            </svg>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:2, width:'100%' }}>
              {['NE','NW','SE','SW'].map(v=>(
                <button key={v} style={{ height:16, background:T.bg3, border:`1px solid ${T.border}`, borderRadius:2, color:T.textMuted, fontSize:6.5, fontFamily:'JetBrains Mono', cursor:'pointer' }}
                  onMouseOver={e=>e.currentTarget.style.color=T.accent}
                  onMouseLeave={e=>e.currentTarget.style.color=T.textMuted}>{v}</button>
              ))}
            </div>
            <button style={{ width:'100%', height:16, background:T.bg3, border:`1px solid ${T.border}`, borderRadius:2, color:T.accent, fontSize:6.5, fontFamily:'JetBrains Mono', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:2 }}>
              <Ico name="fit" size={9} color={T.accent}/> Fit
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   RIGHT INSPECTOR DRAWER
═══════════════════════════════════════════════════ */
function InspectorDrawer({ open, onToggle, theme:T }) {
  const fields = [
    ['Type','Gate Valve'],['Subtype','Gate'],['OD','168.3'],
    ['Rating','PN16'],['Facing','Full-weld'],['End Type','Weld'],
    ['Material','Carbon Steel'],['Pipeline','L01-P-001'],
    ['Route','R-001-A'],['Pos','1500, 0, 0'],['Weight','42.5 kg'],
  ];
  return (
    <div style={{ display:'flex', flexShrink:0, position:'relative', transition:'width 0.18s', width: open?264:20 }}>
      {/* Toggle handle */}
      <button onClick={onToggle} style={{ position:'absolute', left:0, top:'50%', transform:'translateY(-50%)', width:20, height:56, background:T.bg2, border:`1px solid ${T.border}`, borderRadius:'4px 0 0 4px', color:T.textMuted, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', zIndex:10, flexShrink:0 }}>
        <Ico name={open?'chevronR':'chevronL'} size={11} color={T.textMuted}/>
      </button>
      <div style={{ width:244, marginLeft:20, background:T.bg1, borderLeft:`1px solid ${T.border}`, display:'flex', flexDirection:'column', overflow:'hidden', flexShrink:0 }}>
        <div style={{ background:T.bg2, borderBottom:`1px solid ${T.border}`, padding:'5px 8px', display:'flex', alignItems:'center', gap:5 }}>
          <Ico name="info" size={11} color={T.accent}/>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:9, fontWeight:700, color:T.accent, letterSpacing:'0.05em' }}>INSPECTOR</span>
          <div style={{ marginLeft:'auto', background:`${T.yellow}22`, border:`1px solid ${T.yellow}44`, borderRadius:3, padding:'1px 6px', fontFamily:'JetBrains Mono', fontSize:7.5, color:T.yellow }}>VALVE</div>
        </div>
        <div style={{ flex:1, overflow:'auto', padding:'6px 8px' }}>
          {fields.map(([k,v]) => (
            <div key={k} style={{ display:'flex', alignItems:'baseline', gap:4, padding:'2.5px 0', borderBottom:`1px solid ${T.border}33` }}>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted, width:68, flexShrink:0 }}>{k}</span>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textSec, flex:1, textAlign:'right' }}>{v}</span>
            </div>
          ))}
        </div>
        <div style={{ borderTop:`1px solid ${T.border}`, padding:'6px 8px' }}>
          <div style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted, letterSpacing:'0.06em', marginBottom:4 }}>HEATMAP</div>
          <select style={{ width:'100%', background:T.bg0, border:`1px solid ${T.border}`, borderRadius:3, color:T.textSec, fontFamily:'JetBrains Mono', fontSize:8.5, padding:'3px 6px' }}>
            <option>No heatmap</option><option>By OD / Bore</option><option>By Material</option><option>By Temperature</option><option>By Pressure</option>
          </select>
        </div>
        <div style={{ padding:'6px 8px', display:'flex', gap:4 }}>
          <button style={{ flex:1, height:24, background:T.bg3, border:`1px solid ${T.border}`, borderRadius:3, color:T.textSec, fontFamily:'JetBrains Mono', fontSize:8.5, cursor:'pointer' }}>Edit</button>
          <button style={{ flex:1, height:24, background:T.redDim, border:`1px solid ${T.red}55`, borderRadius:3, color:T.red, fontFamily:'JetBrains Mono', fontSize:8.5, cursor:'pointer' }}>Delete</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   MACRO SLIDE-UP TRAY
═══════════════════════════════════════════════════ */
function MacroTray({ open, theme:T }) {
  const hist = [
    { cmd:'> PIPE 0,0,0 5000,0,0 OD=168.3 MAT=CS PN=16', res:'✓ L01-SEG-001 created — 5000 mm' },
    { cmd:'> VALVE 1500,0,0 TYPE=GATE PN16 FW',           res:'✓ Gate valve — 168.3 OD · PN16' },
    { cmd:'> TEE 3700,0,0 BRANCH-OD=88.9 DIR=Z+',        res:'✓ Tee — 168.3 × 88.9' },
  ];
  return (
    <div style={{ background:T.bg0, borderTop:`2px solid ${T.accent}44`, flexShrink:0, overflow:'hidden', transition:'max-height 0.22s ease', maxHeight:open?154:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, padding:'3px 10px', borderBottom:`1px solid ${T.border}` }}>
        <Ico name="term" size={10} color={T.accent}/>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:9, color:T.accent, fontWeight:700 }}>MACRO TERMINAL</span>
        <div style={{ background:T.greenDim, border:`1px solid ${T.green}44`, borderRadius:3, padding:'0 5px', fontFamily:'JetBrains Mono', fontSize:7.5, color:T.green }}>route: L01-P-001</div>
        <span style={{ marginLeft:'auto', fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted }}>3 cmds · Ctrl+Z · F1</span>
      </div>
      <div style={{ height:78, overflowY:'auto', padding:'3px 10px', display:'flex', flexDirection:'column', gap:1 }}>
        {hist.map((h,i)=>(
          <React.Fragment key={i}>
            <div style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.textMuted }}>{h.cmd}</div>
            <div style={{ fontFamily:'JetBrains Mono', fontSize:8.5, color:T.green }}>{h.res}</div>
          </React.Fragment>
        ))}
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:6, padding:'3px 10px', borderTop:`1px solid ${T.border}` }}>
        <span style={{ color:T.accent, fontFamily:'JetBrains Mono', fontSize:12, fontWeight:700, lineHeight:1 }}>›</span>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:9.5, color:T.text, flex:1 }}>
          PIPE 0,0,0 <span style={{ borderRight:`2px solid ${T.accent}`, animation:'blink 1s infinite' }}> </span>
        </span>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted }}>↑↓ history · Ctrl+Z</span>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════ */
function App() {
  const [themeKey, setThemeKey] = React.useState('dark');
  const T = THEMES[themeKey];

  const [activeTool, setActiveTool] = React.useState('line');
  const [hudOpen, setHudOpen] = React.useState(true);
  const [inspectorOpen, setInspectorOpen] = React.useState(true);
  const [macroOpen, setMacroOpen] = React.useState(false);
  const [snapOn, setSnapOn] = React.useState(true);
  const [showLabels, setShowLabels] = React.useState(true);
  const [wireframe, setWireframe] = React.useState(false);

  const activeGroup = LEFT_TOOL_GROUPS.find(g => g.tools.some(t => t.id === activeTool));
  const activeCfg = HUD_CONFIG[activeTool] ?? undefined;

  const handleSetTool = id => {
    setActiveTool(id);
    const cfg = HUD_CONFIG[id];
    if (cfg !== null && cfg !== undefined) setHudOpen(true);
    else setHudOpen(false);
  };

  React.useEffect(() => {
    const h = e => {
      if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
      const k = e.key.toUpperCase();
      for (const t of ALL_TOOLS) if (t.key===k||t.key===e.key) { handleSetTool(t.id); return; }
      if (e.key==='`') setMacroOpen(v=>!v);
      if (e.key==='Escape') setHudOpen(false);
      if (k==='G') setSnapOn(v=>!v);
    };
    window.addEventListener('keydown', h);
    return ()=>window.removeEventListener('keydown', h);
  }, []);

  const Div = ({ style }) => <div style={{ width:1, height:18, background:T.border, flexShrink:0, ...style }}/>;

  const hBtn = (icon, label, onClick, active=false, accent=false) => (
    <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:4, height:24, padding:'0 9px', background: active||accent ? T.accentDim : T.bg3, border:`1px solid ${active||accent ? T.accentBorder : T.border}`, borderRadius:3, color: active||accent ? T.accent : T.textSec, fontFamily:'DM Sans', fontSize:9.5, fontWeight:500, cursor:'pointer', flexShrink:0, transition:'all 0.1s' }}
      onMouseEnter={e=>{e.currentTarget.style.borderColor=T.borderHi;e.currentTarget.style.color=T.text;}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor=active||accent?T.accentBorder:T.border;e.currentTarget.style.color=active||accent?T.accent:T.textSec;}}>
      <Ico name={icon} size={11} color={active||accent?T.accent:T.textSec}/>{label}
    </button>
  );

  return (
    <div style={{ width:'100%', height:'100%', display:'flex', flexDirection:'column', background:T.bg0, color:T.text, overflow:'hidden', fontFamily:'DM Sans, sans-serif' }}>

      {/* ══ TITLE BAR ══ */}
      <div style={{ height:30, background:T.bg1, borderBottom:`1px solid ${T.border}`, display:'flex', alignItems:'center', gap:8, padding:'0 10px', flexShrink:0 }}>
        {/* Logo */}
        <div style={{ width:20, height:20, background:T.accent, borderRadius:3, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:8, fontWeight:800, color:T.bg0 }}>PE</span>
        </div>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:10.5, fontWeight:700, color:T.text, letterSpacing:'0.05em', flexShrink:0 }}>GLB-PCF EDITOR</span>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted, flexShrink:0 }}>Release 1A</span>

        {/* Tabs */}
        <div style={{ display:'flex', gap:0, marginLeft:12, flexShrink:0 }}>
          {['2.5D Viewer','Debug'].map((tab,i)=>(
            <button key={tab} style={{ fontFamily:'DM Sans', fontSize:9.5, fontWeight:600, color:i===0?T.accent:T.textMuted, background:'transparent', border:'none', borderBottom:`2px solid ${i===0?T.accent:'transparent'}`, padding:'0 12px', height:30, cursor:'pointer', flexShrink:0 }}>{tab}</button>
          ))}
        </div>

        {/* ── FILE OPS in header — left of Macro ── */}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:5 }}>
          {hBtn('pcf','Open PCF', ()=>{}, false)}
          {hBtn('glb','Open GLB', ()=>{}, false)}
          <Div/>
          {hBtn('export','Export ▾', ()=>{}, false)}
          <Div/>
          {/* Labels toggle */}
          <button onClick={()=>setShowLabels(v=>!v)} style={{ display:'flex', alignItems:'center', gap:4, height:24, padding:'0 9px', background:showLabels?T.accentDim:T.bg3, border:`1px solid ${showLabels?T.accentBorder:T.border}`, borderRadius:3, color:showLabels?T.accent:T.textSec, fontFamily:'DM Sans', fontSize:9.5, cursor:'pointer', flexShrink:0 }}>
            <Ico name={showLabels?'label':'eyeOff'} size={11} color={showLabels?T.accent:T.textSec}/>
            Labels
          </button>
          {/* Wireframe toggle */}
          <button onClick={()=>setWireframe(v=>!v)} style={{ display:'flex', alignItems:'center', gap:4, height:24, padding:'0 9px', background:wireframe?T.accentDim:T.bg3, border:`1px solid ${wireframe?T.accentBorder:T.border}`, borderRadius:3, color:wireframe?T.accent:T.textSec, fontFamily:'DM Sans', fontSize:9.5, cursor:'pointer', flexShrink:0 }}>
            <Ico name={wireframe?'wire':'solid'} size={11} color={wireframe?T.accent:T.textSec}/>
            {wireframe?'Wireframe':'Solid'}
          </button>
          <Div/>
          {/* Macro toggle */}
          <button onClick={()=>setMacroOpen(v=>!v)} style={{ display:'flex', alignItems:'center', gap:4, height:24, padding:'0 9px', background:macroOpen?T.accentDim:T.bg3, border:`1px solid ${macroOpen?T.accentBorder:T.border}`, borderRadius:3, color:macroOpen?T.accent:T.textSec, fontFamily:'DM Sans', fontSize:9.5, cursor:'pointer', flexShrink:0 }}>
            <Ico name="term" size={11} color={macroOpen?T.accent:T.textSec}/> Macro
          </button>
          <Div/>
          {/* Theme switcher */}
          <div style={{ display:'flex', gap:2, background:T.bg3, borderRadius:4, padding:'2px', border:`1px solid ${T.border}` }}>
            {Object.entries(THEMES).map(([key,th])=>(
              <button key={key} onClick={()=>setThemeKey(key)} title={th.name}
                style={{ height:20, padding:'0 7px', borderRadius:3, border:'none', cursor:'pointer', fontFamily:'JetBrains Mono', fontSize:7.5, fontWeight:600, background:themeKey===key?T.accent:'transparent', color:themeKey===key?T.bg0:T.textMuted, transition:'all 0.1s' }}>
                {th.name.split(' ')[0]}
              </button>
            ))}
          </div>
          <button style={{ width:22, height:22, background:T.bg3, border:`1px solid ${T.border}`, borderRadius:3, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <Ico name={themeKey==='light'?'moon':'sun'} size={11} color={T.textSec}/>
          </button>
        </div>
      </div>

      {/* ══ MAIN ROW ══ */}
      <div style={{ flex:1, display:'flex', overflow:'hidden', position:'relative' }}>

        {/* Left palette — DRAW / INSERT / MODIFY */}
        <ToolPalette activeTool={activeTool} setActiveTool={handleSetTool} theme={T}/>

        {/* Canvas */}
        <div style={{ flex:1, background:T.canvas, position:'relative', overflow:'hidden' }}>
          <PipeCanvas theme={T} showLabels={showLabels} wireframe={wireframe}/>

          {/* Draggable HUD */}
          {hudOpen && activeCfg && (
            <HudCard cfg={activeCfg} theme={T} onClose={()=>setHudOpen(false)}/>
          )}
          {!hudOpen && activeCfg && (
            <button onClick={()=>setHudOpen(true)} style={{ position:'absolute', left:8, top:8, background:T.bg2, border:`1px solid ${activeCfg.color}55`, borderRadius:3, color:activeCfg.color, fontFamily:'JetBrains Mono', fontSize:8.5, padding:'4px 10px', cursor:'pointer', zIndex:100, display:'flex', alignItems:'center', gap:4 }}>
              <Ico name={activeCfg.icon} size={10} color={activeCfg.color}/> HUD
            </button>
          )}

          {/* Cursor / snap bar — bottom centre */}
          <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)', background:`${T.bg1}ee`, border:`1px solid ${T.border}`, borderRadius:3, padding:'3px 12px', display:'flex', gap:12, alignItems:'center', pointerEvents:'none', zIndex:50 }}>
            {[['CURSOR','3244, 0, 0',T.textSec],['SNAP',snapOn?'250mm':'OFF',snapOn?T.green:T.textMuted],['OD','168.3',T.textSec],['PN','16',T.textSec]].map(([l,v,vc])=>(
              <span key={l} style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>
                {l} <span style={{ color:vc }}>{v}</span>
              </span>
            ))}
          </div>

          {/* Active tool pill — top centre */}
          {activeGroup && (
            <div style={{ position:'absolute', top:8, left:'50%', transform:'translateX(-50%)', background:`${T.bg1}ee`, border:`1px solid ${activeGroup.color}44`, borderRadius:3, padding:'3px 12px', display:'flex', gap:6, alignItems:'center', pointerEvents:'none', zIndex:50 }}>
              <Dot color={activeGroup.color} size={5} pulse/>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:activeGroup.color, fontWeight:700 }}>{activeTool.toUpperCase()}</span>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textMuted }}>· Enter commit · Esc cancel</span>
            </div>
          )}
        </div>

        {/* Right view bar — VIEW tools stacked vertically */}
        <ViewBar activeTool={activeTool} setActiveTool={handleSetTool} snapOn={snapOn} setSnapOn={setSnapOn} theme={T}/>

        {/* Right inspector drawer */}
        <InspectorDrawer open={inspectorOpen} onToggle={()=>setInspectorOpen(v=>!v)} theme={T}/>
      </div>

      {/* Macro tray */}
      <MacroTray open={macroOpen} theme={T}/>

      {/* ══ STATUS BAR ══ */}
      <div style={{ height:22, background:T.bg1, borderTop:`1px solid ${T.border}`, display:'flex', alignItems:'center', padding:'0 10px', gap:14, flexShrink:0 }}>
        <Dot color={T.accent} size={5} pulse/>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:8, color:T.textSec }}>
          {activeTool.toUpperCase()} · Pipeline: L01-P-001 · {snapOn?'Snap 250mm':'Snap OFF'}
        </span>
        <div style={{ marginLeft:'auto', display:'flex', gap:14 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted }}>3 components · 1 route</span>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:7.5, color:T.textMuted }}>GLB-PCF-Editor v1A</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
